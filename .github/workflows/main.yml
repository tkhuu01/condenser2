name: Main CI
on: push
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ruff Format
        uses: astral-sh/ruff-action@v3.5.1
        with:
          args: 'format --check'
      - name: Ruff Format Import
        uses: astral-sh/ruff-action@v3.5.1
        with:
          args: 'check --select I'
      - name: Ruff Lint
        uses: astral-sh/ruff-action@v3.5.1

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Copy PostgreSQL 18 client tools from service container
        run: |
          PG_CONTAINER=$(docker ps -q -f "ancestor=postgres:18")
          docker cp "$PG_CONTAINER":/usr/lib/postgresql/18/bin/pg_dump /usr/local/bin/pg_dump
          docker cp "$PG_CONTAINER":/usr/lib/postgresql/18/bin/pg_restore /usr/local/bin/pg_restore
          pg_dump --version
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest tests/ -v
